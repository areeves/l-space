[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "l-space"
version = "0.1.0"
description = "A local-first audiobook library explorer and recommendation assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx2>=2.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
l-space = "l_space.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/l_space"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "evals"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
